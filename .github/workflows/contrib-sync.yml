name: contrib-sync

on:
  pull_request:
    branches:
      - main
    paths:
      - "contrib/sync/**"
      - ".github/workflows/contrib-sync.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
      - name: Shellcheck
        run: shellcheck contrib/sync/omaseal-sync contrib/sync/omaseal-replica-check contrib/sync/omaseal-sync_test.sh
      - name: Test
        run: bash contrib/sync/omaseal-sync_test.sh
