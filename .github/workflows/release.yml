name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # actions/upload-artifact v4+ authenticates via ACTIONS_RUNTIME_TOKEN,
      # so no GITHUB_TOKEN write scope is required here.
    strategy:
      matrix:
        include:
          - goarch: amd64
            release_name: x86_64
          - goarch: arm64
            release_name: aarch64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: engine/go.mod
      - name: Build linux/${{ matrix.goarch }} (${{ matrix.release_name }})
        run: |
          mkdir -p dist/omaseal-linux-${{ matrix.release_name }}
          cd engine
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.goarch }} go build \
            -ldflags "-X main.version=${GITHUB_REF_NAME} -X main.commit=${GITHUB_SHA::7}" \
            -o omaseal .
          cd ..
          cp engine/omaseal dist/omaseal-linux-${{ matrix.release_name }}/omaseal
          cp BarWidget.qml Panel.qml manifest.json README.md LICENSE dist/omaseal-linux-${{ matrix.release_name }}/
          tar -czf dist/omaseal-linux-${{ matrix.release_name }}.tar.gz -C dist omaseal-linux-${{ matrix.release_name }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: omaseal-linux-${{ matrix.release_name }}
          path: dist/omaseal-linux-${{ matrix.release_name }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Write checksums
        run: |
          cd dist
          sha256sum *.tar.gz > sha256sums.txt
      - name: Sign checksums
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$GPG_KEY_ID" ] || [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "GPG signing skipped: add GPG_KEY_ID and GPG_PRIVATE_KEY secrets for signed releases." >&2
            exit 0
          fi
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          cd dist
          gpg --batch --yes --armor --detach-sign --default-key "$GPG_KEY_ID" -o sha256sums.txt.asc sha256sums.txt
      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/*.tar.gz
            dist/sha256sums*
          generate_release_notes: true

  # Post-release packaging bump. makepkg only exists on Arch, and container
  # jobs run as root while makepkg refuses root — so the work runs in a
  # builder-owned copy of the checkout via runuser. gh is not in the
  # archlinux image, hence github-cli in the pacman line; and because the
  # checkout uses persist-credentials: false, `gh auth setup-git` supplies
  # the push credentials. Note: a GITHUB_TOKEN-authored PR does not trigger
  # ci.yml's pull_request checks — it merges on maintainer review.
  bump-packaging:
    needs: release
    runs-on: ubuntu-latest
    container: archlinux:latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install build tools
        run: pacman -Sy --noconfirm base-devel git github-cli
      - name: Bump packaging and open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OMASEAL_SIGNING_FINGERPRINT: ${{ secrets.OMASEAL_SIGNING_FINGERPRINT }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          useradd -m builder
          cp -a "$GITHUB_WORKSPACE" /home/builder/ws
          chown -R builder:builder /home/builder/ws
          runuser -u builder -- env \
            GH_TOKEN="$GH_TOKEN" TAG="$TAG" \
            OMASEAL_SIGNING_FINGERPRINT="${OMASEAL_SIGNING_FINGERPRINT:-}" \
            bash -euo pipefail -c '
              cd /home/builder/ws
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              gh auth setup-git
              git checkout -b "bump/${TAG}"
              if [ -n "${OMASEAL_SIGNING_FINGERPRINT:-}" ]; then
                packaging/aur/bump.sh "${TAG}"
              else
                packaging/aur/bump.sh "${TAG}" --allow-unsigned
              fi
              git add packaging/aur/PKGBUILD packaging/aur/PKGBUILD-bin \
                      packaging/aur/.SRCINFO packaging/aur/omaseal-bin.SRCINFO \
                      install.sh
              changed=$(git diff --cached --name-only | sort)
              expected=$(printf "%s\n" install.sh packaging/aur/.SRCINFO \
                packaging/aur/PKGBUILD packaging/aur/PKGBUILD-bin \
                packaging/aur/omaseal-bin.SRCINFO | sort)
              [ "$changed" = "$expected" ] || {
                echo "unexpected diff scope:" >&2
                git diff --cached --name-only >&2
                exit 1
              }
              git commit -m "chore(packaging): bump pins to ${TAG}"
              git push -u origin "bump/${TAG}"
              gh pr create --title "chore(packaging): bump AUR/installer pins to ${TAG}" \
                --body "Automated post-release pin bump for ${TAG}. Verify the pinned hashes against the release assets before merging."
            '
