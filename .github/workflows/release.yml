name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: engine/go.mod
      - name: Build linux/${{ matrix.arch }}
        run: |
          mkdir -p dist/omaseal-linux-${{ matrix.arch }}
          cd engine
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} go build \
            -ldflags "-X main.version=${GITHUB_REF_NAME} -X main.commit=${GITHUB_SHA::7}" \
            -o omaseal .
          cd ..
          cp engine/omaseal dist/omaseal-linux-${{ matrix.arch }}/omaseal
          cp BarWidget.qml Panel.qml manifest.json README.md LICENSE dist/omaseal-linux-${{ matrix.arch }}/
          tar -czf dist/omaseal-linux-${{ matrix.arch }}.tar.gz -C dist omaseal-linux-${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: omaseal-linux-${{ matrix.arch }}
          path: dist/omaseal-linux-${{ matrix.arch }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Write checksums
        run: |
          cd dist
          sha256sum *.tar.gz > sha256sums.txt
      - name: Sign checksums
        if: env.GPG_KEY_ID != ''
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          cd dist
          gpg --batch --yes --armor --detach-sign --default-key "$GPG_KEY_ID" -o sha256sums.txt.asc sha256sums.txt
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/sha256sums.txt
          generate_release_notes: true
