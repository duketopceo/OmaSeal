name: macos-app

on:
  pull_request:
    branches:
      - main
    paths:
      - "macos/**"
      - ".github/workflows/macos-app.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build --package-path macos --product OmaSealBar
      - name: Test
        run: swift test --package-path macos
